<h1>Home Component</h1>
<table>
    <thead>
        <tr>
            <th>Id Departamento</th>
            <th>Nombre</th>
            <th>Localidad</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        @for (dept of departamentos; track dept) {
            <tr>
                <td>{{dept.numero}}</td>
                <td>{{dept.nombre}}</td>
                <td>{{dept.localidad}}</td>
                <td>
                    <a [routerLink]="['/details', dept.numero, dept.nombre, dept.localidad]" class="btn btn-light">
                        Deatails
                    </a>
                    <!--ESTA ES OTRA FORMA DE NAVEGACIONN, MAS CODIGO
                        <a [routerLink]="['/details/' + dept.numero + '/' + dept.nombre + '/' + dept.localidad]">
                            Deatails
                        </a>
                    -->
                </td>
                <td>
                    <a [routerLink]="['/update', dept.numero]" class="btn btn-info">
                        Edit
                    </a>
                </td>
                <td>
                    <button class="btn btn-danger" (click)="deleteDepartamento(dept.numero)">
                        Delete
                    </button>
                </td>
            </tr>
        }
    </tbody>
</table>
